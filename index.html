<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Pictures</title>
<style>
  /* Kept deliberately simple so older Tizen (Samsung) and webOS (LG) browsers render it */
  html, body { margin: 0; padding: 0; background: #111; color: #eee; height: 100%;
    font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  #picker { height: 100%; overflow-y: auto; padding: 2.5vw; box-sizing: border-box; }
  h1 { font-size: 3vw; margin: 0 0 0.4vw 0; font-weight: normal; }
  .hint { font-size: 1.4vw; color: #999; margin-bottom: 2vw; }
  #grid { font-size: 0; }
  .tile { display: inline-block; width: 22vw; margin: 0 1.5vw 1.5vw 0; vertical-align: top;
    background: #222; border: 0.4vw solid transparent; border-radius: 0.8vw; cursor: pointer;
    box-sizing: border-box; overflow: hidden; outline: none; }
  .tile .thumb { width: 100%; height: 13vw; background: #000 center center no-repeat;
    background-size: cover; }
  .tile .name { font-size: 1.3vw; padding: 0.6vw 0.8vw; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: #ccc; }
  .tile.focused { border-color: #ffcc00; background: #333; }
  .tile.focused .name { color: #fff; }
  #empty { font-size: 2vw; color: #aaa; display: none; }
  #viewer { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: #000;
    display: none; cursor: pointer; }
  #big { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    background: #000 center center no-repeat; -webkit-background-size: contain;
    background-size: contain; }
  #caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 1vw 2vw;
    font-size: 1.4vw; color: #ddd; background: rgba(0,0,0,0.55);
    -webkit-transition: opacity 0.8s; transition: opacity 0.8s; }
  #caption.faded { opacity: 0; }
</style>
</head>
<body>
<div id="picker">
  <h1>Choose a picture</h1>
  <div class="hint">Arrow keys to move &middot; OK to show &middot; Back to return &middot; Left/Right to flip through</div>
  <div id="grid"></div>
  <div id="empty">No pictures found. Put image files in the <b>pictures</b> folder, then reload this page.</div>
</div>
<div id="viewer"><div id="big"></div><div id="caption"></div></div>

<script>
// ES5 only — no arrow functions, let/const, fetch or promises, for older TV browsers.
var pics = [];
var current = 0;
var viewing = false;
var tiles = [];
var captionTimer = null;

var KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13,
  BACK: [8, 27, 461, 10009] }; // Backspace, Esc, LG Back, Samsung Back

function $(id) { return document.getElementById(id); }

function load() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'pictures.json?t=' + new Date().getTime(), true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    try { pics = JSON.parse(xhr.responseText); } catch (e) { pics = []; }
    build();
  };
  xhr.send();
}

function build() {
  var grid = $('grid');
  grid.innerHTML = '';
  tiles = [];
  if (!pics.length) { $('empty').style.display = 'block'; return; }
  for (var i = 0; i < pics.length; i++) {
    var tile = document.createElement('div');
    tile.className = 'tile';
    tile.setAttribute('tabindex', '0');
    tile.setAttribute('data-i', i);
    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.style.backgroundImage = 'url("' + picUrl(i) + '")';
    var name = document.createElement('div');
    name.className = 'name';
    name.appendChild(document.createTextNode(pics[i]));
    tile.appendChild(thumb);
    tile.appendChild(name);
    tile.onclick = onTileClick;
    tile.onmouseover = onTileHover; // LG Magic Remote pointer
    grid.appendChild(tile);
    tiles.push(tile);
  }
  focusTile(0);
}

function picUrl(i) { return 'pictures/' + encodeURIComponent(pics[i]); }

function onTileClick() { focusTile(+this.getAttribute('data-i')); show(current); }
function onTileHover() { focusTile(+this.getAttribute('data-i')); }

function focusTile(i) {
  if (!tiles.length) return;
  if (i < 0) i = 0;
  if (i > tiles.length - 1) i = tiles.length - 1;
  if (tiles[current]) tiles[current].className = 'tile';
  current = i;
  tiles[i].className = 'tile focused';
  try { tiles[i].focus(); } catch (e) {}
  if (tiles[i].scrollIntoView) tiles[i].scrollIntoView(false);
}

function perRow() {
  if (tiles.length < 2) return 1;
  var top = tiles[0].offsetTop, n = 0;
  while (n < tiles.length && tiles[n].offsetTop === top) n++;
  return n || 1;
}

function show(i) {
  if (!pics.length) return;
  if (tiles[current]) tiles[current].className = 'tile';
  current = (i + pics.length) % pics.length;
  if (tiles[current]) tiles[current].className = 'tile focused';
  $('big').style.backgroundImage = 'url("' + picUrl(current) + '")';
  $('caption').innerHTML = '';
  $('caption').appendChild(document.createTextNode(
    pics[current] + '   (' + (current + 1) + ' of ' + pics.length + ')'));
  $('caption').className = '';
  clearTimeout(captionTimer);
  captionTimer = setTimeout(function () { $('caption').className = 'faded'; }, 2500);
  $('viewer').style.display = 'block';
  if (!viewing) enterFullscreen();
  viewing = true;
}

function hide() {
  $('viewer').style.display = 'none';
  viewing = false;
  exitFullscreen();
  focusTile(current);
}

// Hide the TV browser's address bar/toolbar while a picture is showing.
// Each browser spells these differently, and some old ones have none — then we just fill the page.
function fullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement ||
    document.webkitCurrentFullScreenElement || null;
}

function enterFullscreen() {
  var el = document.documentElement;
  var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
  if (!fn || fullscreenElement()) return;
  try {
    var result = fn.call(el);
    if (result && result['catch']) result['catch'](function () {});
  } catch (e) {}
}

function exitFullscreen() {
  var fn = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen;
  if (!fn || !fullscreenElement()) return;
  try {
    var result = fn.call(document);
    if (result && result['catch']) result['catch'](function () {});
  } catch (e) {}
}

// If the TV's own Back button leaves full screen first, go back to the grid too.
function onFullscreenChange() {
  if (viewing && !fullscreenElement()) hide();
}
document.addEventListener('fullscreenchange', onFullscreenChange, false);
document.addEventListener('webkitfullscreenchange', onFullscreenChange, false);

$('viewer').onclick = hide;

document.onkeydown = function (e) {
  e = e || window.event;
  var k = e.keyCode;
  var isBack = false;
  for (var b = 0; b < KEY.BACK.length; b++) if (k === KEY.BACK[b]) isBack = true;

  if (viewing) {
    if (k === KEY.LEFT) show(current - 1);
    else if (k === KEY.RIGHT) show(current + 1);
    else if (isBack || k === KEY.ENTER) hide();
    else return true;
  } else {
    if (k === KEY.LEFT) focusTile(current - 1);
    else if (k === KEY.RIGHT) focusTile(current + 1);
    else if (k === KEY.UP) focusTile(current - perRow());
    else if (k === KEY.DOWN) focusTile(current + perRow());
    else if (k === KEY.ENTER) show(current);
    else return true; // let Back leave the page normally when on the grid
  }
  if (e.preventDefault) e.preventDefault();
  return false;
};

load();
</script>
</body>
</html>
