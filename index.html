<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Pictures</title>
<style>
  /* Kept deliberately simple so older Tizen (Samsung) and webOS (LG) browsers render it.
     Sizes use vw so everything scales with the TV's screen. */
  html, body { margin: 0; padding: 0; background: #14161a; color: #f2f2f2; height: 100%;
    font-family: Arial, Helvetica, sans-serif; overflow: hidden; }

  #picker { position: absolute; left: 0; top: 0; right: 0; bottom: 6vw; overflow-y: auto;
    padding: 2.5vw 3vw 1vw 3vw; }
  #header { margin-bottom: 2vw; }
  h1 { display: inline-block; font-size: 3.4vw; margin: 0; font-weight: bold; }
  #count { display: inline-block; font-size: 1.8vw; color: #9aa3ad; margin-left: 1.5vw; }

  #grid { font-size: 0; }
  .tile { display: inline-block; width: 28.5vw; margin: 0 1.5vw 1.8vw 0; vertical-align: top;
    -webkit-box-sizing: border-box; box-sizing: border-box;
    background: #23262c; border: 0.5vw solid transparent; border-radius: 1vw; cursor: pointer;
    overflow: hidden; outline: none; }
  .tile .thumb { height: 16.5vw; background: #000 center center no-repeat;
    -webkit-background-size: cover; background-size: cover; position: relative; }
  .tile .thumb .wait { position: absolute; left: 0; right: 0; top: 7vw; text-align: center;
    font-size: 1.5vw; color: #6c737c; }
  .tile .name { font-size: 1.9vw; padding: 0.9vw 1.2vw; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: #c9ced4; }
  .tile.focused { border-color: #ffc928; background: #30343b;
    -webkit-transform: scale(1.03); transform: scale(1.03); }
  .tile.focused .name { color: #fff; font-weight: bold; }
  .tile { position: relative; }
  .tile .badge { position: absolute; left: 1vw; top: 1vw; padding: 0.3vw 0.9vw;
    border-radius: 0.5vw; background: #d62828; color: #fff; font-size: 1.4vw; font-weight: bold; }

  #message { display: none; margin: 6vw auto 0 auto; max-width: 62vw; text-align: center; }
  #message .big { font-size: 3vw; margin-bottom: 1.5vw; }
  #message .small { font-size: 2vw; color: #9aa3ad; line-height: 1.4; }

  #help { position: absolute; left: 0; right: 0; bottom: 0; height: 6vw; background: #0c0d10;
    font-size: 1.8vw; color: #c9ced4; text-align: center; line-height: 6vw; white-space: nowrap; }
  .key { display: inline-block; background: #3a3f47; color: #fff; border-radius: 0.6vw;
    padding: 0 0.9vw; line-height: 3vw; font-weight: bold; margin: 0 0.5vw 0 2.5vw; }

  #viewer { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: #000;
    display: none; cursor: pointer; }
  #big { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    background: #000 center center no-repeat; -webkit-background-size: contain;
    background-size: contain; }
  #loading { position: absolute; left: 0; right: 0; top: 46%; text-align: center;
    font-size: 2.4vw; color: #9aa3ad; display: none; }
  #caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 1.4vw 3vw;
    font-size: 2vw; color: #fff; background: rgba(0,0,0,0.6); white-space: nowrap;
    -webkit-transition: opacity 0.8s; transition: opacity 0.8s; }
  #caption .where { float: right; color: #c9ced4; }
  #caption.faded { opacity: 0; }
  #video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: none; }
  #video iframe { width: 100%; height: 100%; border: 0; display: block; }
  #sharpening { position: absolute; right: 2vw; top: 2vw; padding: 0.6vw 1.2vw;
    border-radius: 0.6vw; background: rgba(0,0,0,0.65); color: #ddd; font-size: 1.5vw;
    display: none; }
</style>
</head>
<body>
<div id="picker">
  <div id="header"><h1>Pick a picture</h1><span id="count"></span></div>
  <div id="grid"></div>
  <div id="message"><div class="big"></div><div class="small"></div></div>
</div>
<div id="help">
  <span class="key">&#9664; &#9650; &#9660; &#9654;</span>Move
  <span class="key">OK</span>Show picture
  <span class="key">BACK</span>Return here
</div>
<div id="viewer">
  <div id="big"></div>
  <div id="video"></div>
  <div id="loading">Loading picture&hellip;</div>
  <div id="sharpening">Loading full quality&hellip;</div>
  <div id="caption"><span class="where"></span><span class="what"></span></div>
</div>

<script src="config.js"></script>
<script>
// ES5 only — no arrow functions, let/const, fetch or promises, for older TV browsers.
if (typeof PICTURE_SOURCE === 'undefined') var PICTURE_SOURCE = '';
if (typeof FOLDER_NAME === 'undefined') var FOLDER_NAME = 'TV Pictures';
if (typeof REFRESH_SECONDS === 'undefined') var REFRESH_SECONDS = 60;

var pics = [];          // [{id, name, updated, url}]
var listKey = '';       // used to spot when the folder changes
var current = 0;
var viewing = false;
var tiles = [];
var captionTimer = null;
var thumbs = {};        // picture key -> image address for the grid (null while loading)
var fulls = {};         // picture key -> sharp image address
var fullOrder = [];
var fullWaiting = {};   // picture key -> callbacks waiting for its sharp version
var fullFailed = {};    // picture key -> true if the sharp version kept failing
var MAX_FULLS = 20;     // how many sharp pictures to keep ready

var KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13,
  PLAY: 415, PAUSE: 19, PLAYPAUSE: 10252, // remote media buttons, where the TV passes them on
  BACK: [8, 27, 461, 10009] }; // Backspace, Esc, LG Back, Samsung Back

function $(id) { return document.getElementById(id); }
function setText(el, text) { el.innerHTML = ''; el.appendChild(document.createTextNode(text)); }

/* ---------- Getting the pictures ---------- */

var callbackCount = 0;
// Ask the Google script for something; it answers by calling a function we name (JSONP).
function askDrive(params, done, timeoutMs) {
  var name = 'tvcb' + (++callbackCount);
  var script = document.createElement('script');
  var finished = false;
  var timer = setTimeout(function () { finish(null); }, timeoutMs || 45000);
  function finish(data) {
    if (finished) return;
    finished = true;
    clearTimeout(timer);
    window[name] = function () {};
    if (script.parentNode) script.parentNode.removeChild(script);
    done(data && !data.error ? data : null);
  }
  window[name] = finish;
  script.onerror = function () { finish(null); };
  script.src = PICTURE_SOURCE + (PICTURE_SOURCE.indexOf('?') < 0 ? '?' : '&') +
    params + '&callback=' + name + '&t=' + new Date().getTime();
  document.body.appendChild(script);
}

function loadList(done) {
  if (PICTURE_SOURCE) {
    askDrive('action=list', function (data) {
      var list = data ? data.pictures : null;
      for (var i = 0; list && i < list.length; i++) {
        if (list[i].youtube) list[i].url = 'https://img.youtube.com/vi/' + list[i].youtube + '/hqdefault.jpg';
      }
      done(list);
    });
    return;
  }
  // No Drive set up: use this site's own pictures folder.
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'pictures.json?t=' + new Date().getTime(), true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    var names = null;
    try { names = JSON.parse(xhr.responseText); } catch (e) {}
    if (!names) { done(null); return; }
    var list = [];
    for (var i = 0; i < names.length; i++) {
      list.push({ id: names[i], name: names[i], updated: 0,
        url: 'pictures/' + encodeURIComponent(names[i]) });
    }
    done(list);
  };
  xhr.send();
}

function picKey(pic) { return pic.id + ':' + pic.updated; }

// Gets a picture at roughly the given width; calls done(address) or done(null).
function loadImage(pic, size, done, timeoutMs) {
  if (pic.url) { done(pic.url); return; }
  askDrive('action=image&size=' + size + '&id=' + encodeURIComponent(pic.id),
    function (data) { done(data ? data.data : null); }, timeoutMs);
}

/* ---------- Grid ---------- */

function friendlyName(fileName) {
  var name = fileName.replace(/\.[A-Za-z0-9]+$/, '').replace(/[_\-]+/g, ' ');
  name = name.replace(/^\s+|\s+$/g, '');
  // "01 Welcome" -> "Welcome": numbers at the front are just for ordering.
  var unnumbered = name.replace(/^\d+\s+/, '');
  return unnumbered || name || fileName;
}

function refresh() {
  loadList(function (list) {
    if (!list) {
      if (!pics.length) showMessage('Can’t reach the pictures right now',
        'Check that the TV is connected to the internet. Trying again in a moment…');
      return;
    }
    var key = '';
    for (var i = 0; i < list.length; i++) key += picKey(list[i]) + '|';
    if (key === listKey && tiles.length) return;
    listKey = key;
    var keepId = pics[current] ? pics[current].id : null;
    pics = list;
    build(keepId);
  });
}

function build(keepId) {
  var grid = $('grid');
  grid.innerHTML = '';
  tiles = [];
  if (!pics.length) {
    $('count').innerHTML = '';
    showMessage('No pictures yet',
      'Add pictures to the “' + FOLDER_NAME + '” folder in Google Drive. ' +
      'They will appear here by themselves within a minute or two.');
    if (viewing) hide();
    return;
  }
  var videoCount = 0;
  for (var v = 0; v < pics.length; v++) if (pics[v].youtube) videoCount++;
  var pictureCount = pics.length - videoCount;
  var counts = [];
  if (pictureCount) counts.push(pictureCount === 1 ? '1 picture' : pictureCount + ' pictures');
  if (videoCount) counts.push(videoCount === 1 ? '1 video' : videoCount + ' videos');
  setText($('count'), counts.join(' · '));
  $('message').style.display = 'none';
  var focusAt = 0;
  for (var i = 0; i < pics.length; i++) {
    if (pics[i].id === keepId) focusAt = i;
    var tile = document.createElement('div');
    tile.className = 'tile';
    tile.setAttribute('data-i', i);
    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    var known = thumbs[picKey(pics[i])];
    if (known) thumb.style.backgroundImage = 'url("' + known + '")';
    else thumb.innerHTML = '<div class="wait">Loading&hellip;</div>';
    var name = document.createElement('div');
    name.className = 'name';
    name.appendChild(document.createTextNode(friendlyName(pics[i].name)));
    tile.appendChild(thumb);
    tile.appendChild(name);
    if (pics[i].youtube) {
      var badge = document.createElement('div');
      badge.className = 'badge';
      badge.appendChild(document.createTextNode('\u25B6 Video'));
      tile.appendChild(badge);
    }
    tile.onclick = onTileClick;
    tile.onmouseover = onTileHover; // LG Magic Remote pointer
    grid.appendChild(tile);
    tiles.push(tile);
  }
  current = focusAt;
  if (viewing) tiles[current].className = 'tile focused';
  else focusTile(focusAt);
  loadThumbs();
}

// Fill in the grid pictures a few at a time so the TV and Google aren't swamped.
var thumbsBusy = 0;
function loadThumbs() {
  for (var i = 0; i < pics.length && thumbsBusy < 3; i++) {
    var pic = pics[i];
    var k = picKey(pic);
    if (thumbs[k] !== undefined) continue;
    thumbs[k] = null; // in progress
    thumbsBusy++;
    loadImage(pic, 640, thumbArrived(k));
  }
  preloadFulls();
}

function thumbArrived(k) {
  return function (src) {
    thumbsBusy--;
    if (!src) { delete thumbs[k]; return; } // try again on the next refresh
    thumbs[k] = src;
    for (var i = 0; i < pics.length; i++) {
      if (picKey(pics[i]) === k && tiles[i]) {
        var thumb = tiles[i].firstChild;
        thumb.innerHTML = '';
        thumb.style.backgroundImage = 'url("' + src + '")';
      }
    }
    loadThumbs();
  };
}

function showMessage(big, small) {
  var box = $('message');
  setText(box.firstChild, big);
  setText(box.lastChild, small);
  box.style.display = 'block';
}

function onTileClick() { focusTile(+this.getAttribute('data-i')); show(current); }
function onTileHover() { focusTile(+this.getAttribute('data-i')); }

function focusTile(i) {
  if (!tiles.length) return;
  if (i < 0) i = 0;
  if (i > tiles.length - 1) i = tiles.length - 1;
  if (tiles[current]) tiles[current].className = 'tile';
  current = i;
  tiles[i].className = 'tile focused';
  if (tiles[i].scrollIntoView) tiles[i].scrollIntoView(false);
}

function perRow() {
  if (tiles.length < 2) return 1;
  var top = tiles[0].offsetTop, n = 0;
  while (n < tiles.length && tiles[n].offsetTop === top) n++;
  return n || 1;
}

/* ---------- Full-screen viewer ---------- */

function fullSize() {
  var w = (window.screen && window.screen.width) || 1920;
  return w > 1920 ? 2560 : 1920;
}

function rememberFull(k, src) {
  if (fulls[k]) return;
  fulls[k] = src;
  fullOrder.push(k);
  while (fullOrder.length > MAX_FULLS) delete fulls[fullOrder.shift()];
}

// Gets a picture's sharp version, sharing one request between callers and retrying
// a couple of times — Google can be slow, and big pictures take a while on a TV.
function loadFull(pic, done) {
  var k = picKey(pic);
  if (pic.url) { done(pic.url); return; }
  if (fulls[k]) { done(fulls[k]); return; }
  if (fullWaiting[k]) { fullWaiting[k].push(done); return; }
  fullWaiting[k] = [done];
  var tries = 0;
  function attempt() {
    tries++;
    loadImage(pic, fullSize(), function (src) {
      if (!src && tries < 3) { setTimeout(attempt, 2000); return; }
      if (src) { rememberFull(k, src); delete fullFailed[k]; } else fullFailed[k] = true;
      var waiting = fullWaiting[k];
      delete fullWaiting[k];
      for (var i = 0; i < waiting.length; i++) waiting[i](src);
    }, 90000);
  }
  attempt();
}

// Once the grid is filled in, fetch the sharp pictures one at a time in the background,
// starting from the selected one, so OK shows them sharp straight away.
var preloading = false;
function preloadFulls() {
  if (preloading || thumbsBusy > 0) return;
  for (var n = 0; n < pics.length && n < MAX_FULLS; n++) {
    var pic = pics[(current + n) % pics.length];
    var k = picKey(pic);
    if (pic.url || fulls[k] || fullWaiting[k] || fullFailed[k]) continue;
    preloading = true;
    loadFull(pic, function () { preloading = false; preloadFulls(); });
    return;
  }
}

function showCaption() {
  $('caption').className = '';
  clearTimeout(captionTimer);
  captionTimer = setTimeout(function () { $('caption').className = 'faded'; }, 3500);
}

function show(i) {
  if (!pics.length) return;
  if (tiles[current]) tiles[current].className = 'tile';
  current = (i + pics.length) % pics.length;
  if (tiles[current]) tiles[current].className = 'tile focused';
  var pic = pics[current];
  var k = picKey(pic);

  setText($('caption').lastChild, friendlyName(pic.name));
  var more = pics.length > 1 ? '\u00A0\u00A0\u00A0 \u25C0 \u25B6 more' : '';
  setText($('caption').firstChild, (current + 1) + ' of ' + pics.length +
    (pic.youtube ? '\u00A0\u00A0\u00A0 OK pause/play' : '') + more + '\u00A0\u00A0\u00A0 BACK to return');
  showCaption();

  $('viewer').style.display = 'block';
  if (!viewing) enterFullscreen();
  viewing = true;

  stopVideo();
  if (pic.youtube) { playVideo(pic); return; }
  if (fulls[k] || pic.url) { showImage(fulls[k] || pic.url); return; }
  // Not ready yet: show the small version with a note, then swap in the sharp one.
  $('big').style.backgroundImage = thumbs[k] ? 'url("' + thumbs[k] + '")' : 'none';
  setText($('loading'), 'Loading picture…');
  $('loading').style.display = thumbs[k] ? 'none' : 'block';
  setText($('sharpening'), 'Loading full quality…');
  $('sharpening').style.display = thumbs[k] ? 'block' : 'none';
  loadFull(pic, function (src) {
    if (!viewing || pics[current] !== pic) return;
    if (src) { showImage(src); return; }
    if (thumbs[k]) setText($('sharpening'), 'Full quality didn’t load. Press OK, then OK again to retry.');
    else setText($('loading'), 'Sorry, this picture wouldn’t load.');
  });
}

function showImage(src) {
  $('loading').style.display = 'none';
  $('sharpening').style.display = 'none';
  $('big').style.backgroundImage = 'url("' + src + '")';
}

function hide() {
  stopVideo();
  $('viewer').style.display = 'none';
  $('sharpening').style.display = 'none';
  viewing = false;
  exitFullscreen();
  focusTile(current);
}

$('viewer').onclick = hide;

/* ---------- YouTube videos ---------- */

var videoPlaying = false;

function playVideo(pic) {
  $('big').style.backgroundImage = 'none';
  $('loading').style.display = 'none';
  $('sharpening').style.display = 'none';
  var frame = document.createElement('iframe');
  frame.setAttribute('src', 'https://www.youtube.com/embed/' + pic.youtube +
    '?autoplay=1&rel=0&playsinline=1&enablejsapi=1&origin=' +
    encodeURIComponent(location.protocol + '//' + location.host));
  frame.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture');
  frame.setAttribute('allowfullscreen', 'true');
  frame.setAttribute('frameborder', '0');
  frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  frame.onload = function () {
    videoPlaying = true;
    videoCommand('playVideo');
    // Ask YouTube to tell us when the video plays or pauses, so OK toggles correctly.
    try { frame.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1 }), '*'); } catch (e) {}
  };
  $('video').appendChild(frame);
  $('video').style.display = 'block';
}

function videoCommand(func) {
  var frame = $('video').firstChild;
  if (!frame || !frame.contentWindow) return;
  try {
    frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: [] }), '*');
  } catch (e) {}
}

function toggleVideo() {
  videoCommand(videoPlaying ? 'pauseVideo' : 'playVideo');
  videoPlaying = !videoPlaying;
  showCaption();
}

function stopVideo() {
  $('video').innerHTML = ''; // removing the player stops it
  $('video').style.display = 'none';
  videoPlaying = false;
}

function onYouTubeMessage(e) {
  if (!/youtube/.test(e.origin || '')) return;
  var data = null;
  try { data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (err) { return; }
  var state = data && data.info && data.info.playerState;
  if (typeof state === 'number') videoPlaying = state === 1 || state === 3; // playing or buffering
}
if (window.addEventListener) window.addEventListener('message', onYouTubeMessage, false);

// If the video gets clicked (LG pointer), take the remote back so Back still returns here.
window.onblur = function () {
  setTimeout(function () {
    var frame = $('video').firstChild;
    if (frame && document.activeElement === frame) {
      try { frame.blur(); window.focus(); } catch (e) {}
    }
  }, 300);
};

// Hide the TV browser's address bar/toolbar while a picture is showing.
// Each browser spells these differently, and some old ones have none — then we just fill the page.
function fullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement ||
    document.webkitCurrentFullScreenElement || null;
}

function enterFullscreen() {
  var el = document.documentElement;
  var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
  if (!fn || fullscreenElement()) return;
  try {
    var result = fn.call(el);
    if (result && result['catch']) result['catch'](function () {});
  } catch (e) {}
}

function exitFullscreen() {
  var fn = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen;
  if (!fn || !fullscreenElement()) return;
  try {
    var result = fn.call(document);
    if (result && result['catch']) result['catch'](function () {});
  } catch (e) {}
}

// If the TV's own Back button leaves full screen first, go back to the grid too.
function onFullscreenChange() {
  if (viewing && !fullscreenElement()) hide();
}
document.addEventListener('fullscreenchange', onFullscreenChange, false);
document.addEventListener('webkitfullscreenchange', onFullscreenChange, false);

/* ---------- Remote control ---------- */

document.onkeydown = function (e) {
  e = e || window.event;
  var k = e.keyCode;
  var isBack = false;
  for (var b = 0; b < KEY.BACK.length; b++) if (k === KEY.BACK[b]) isBack = true;

  var onVideo = viewing && pics[current] && pics[current].youtube;

  if (onVideo && k === KEY.ENTER) toggleVideo();
  else if (onVideo && k === KEY.PLAY) { videoCommand('playVideo'); videoPlaying = true; }
  else if (onVideo && k === KEY.PAUSE) { videoCommand('pauseVideo'); videoPlaying = false; }
  else if (onVideo && k === KEY.PLAYPAUSE) toggleVideo();
  else if (viewing) {
    if (k === KEY.LEFT) show(current - 1);
    else if (k === KEY.RIGHT) show(current + 1);
    else if (isBack || k === KEY.ENTER) hide();
    else if (k === KEY.UP || k === KEY.DOWN) showCaption();
    else return true;
  } else {
    if (k === KEY.LEFT) focusTile(current - 1);
    else if (k === KEY.RIGHT) focusTile(current + 1);
    else if (k === KEY.UP) focusTile(current - perRow());
    else if (k === KEY.DOWN) focusTile(current + perRow());
    else if (k === KEY.ENTER) show(current);
    else return true; // let Back leave the page normally when on the grid
  }
  if (e.preventDefault) e.preventDefault();
  return false;
};

showMessage('Loading pictures…', '');
refresh();
setInterval(refresh, Math.max(15, REFRESH_SECONDS) * 1000);
</script>
</body>
</html>
